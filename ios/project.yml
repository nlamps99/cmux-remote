name: CmuxRemote
options:
  bundleIdPrefix: com.genie
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "2UANJX7ATM"
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
packages:
  SharedKit:
    path: ..
  IOSSecuritySuite:
    url: https://github.com/securing/IOSSecuritySuite
    from: "1.9.10"
targets:
  CmuxRemote:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CmuxRemote/CmuxRemote.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    sources:
      - path: CmuxRemote
        excludes:
          - "Resources/Fonts/LICENSE-*.txt"
    info:
      path: CmuxRemote/Info.plist
      properties:
        CFBundleDisplayName: "cmux Remote"
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: "1.0.8"
        CFBundleVersion: "10"
        # The terminal dashboard is designed for one full-size canvas on iPad.
        # This also prevents a previously iPhone-only installation being presented
        # in a narrow compatibility-sized window.
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [cmux]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Local network access is needed to connect to the cmux relay running on your Mac and remotely control workspaces and terminals."
        NSCameraUsageDescription: "Camera access is used only to scan the pairing QR code shown by cmux-relay on your Mac, so you do not have to type the server URL and pairing code by hand."
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - "DepartureMono-Regular.otf"
          - "GeistMono-Regular.ttf"
          - "GeistMono-Medium.ttf"
          - "GeistMono-Bold.ttf"
    dependencies:
      - package: SharedKit
        product: SharedKit
      - package: IOSSecuritySuite
        product: IOSSecuritySuite
  CmuxRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: CmuxRemoteTests
    info:
      path: CmuxRemoteTests/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.8"
        CFBundleVersion: "10"
    dependencies:
      - target: CmuxRemote
  CmuxRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: CmuxRemoteUITests
    info:
      path: CmuxRemoteUITests/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.8"
        CFBundleVersion: "10"
    dependencies:
      - target: CmuxRemote
schemes:
  CmuxRemote:
    build:
      targets:
        CmuxRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CmuxRemoteTests
        - CmuxRemoteUITests
    archive:
      config: Release
